[package]
name = "leakscope-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Extracts the publicly visible facts of a Zcash transaction (v4-v6, incl. Ironwood)"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "leakscope-parse"
path = "src/main.rs"

[dependencies]
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
orchard = { version = "0.16", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
